<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="script-src 'self' 'wasm-unsafe-eval'; connect-src 'self' wss: https://xumm.app https://oauth2.xumm.app; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Handpost</title>

<style>
body{font-family:system-ui,sans-serif;max-width:560px;margin:24px auto;padding:0 16px;line-height:1.7;color:#e8ecf4;background:#0d1424}
h1{font-size:19px;margin:0 0 12px} .card{background:#141d33;border-radius:10px;padding:14px 16px;margin:12px 0}
.note{font-size:13px;color:#9aa6bd;white-space:pre-line} .warn{border-left:3px solid #e0a23c;background:#2a2112;padding:8px 10px;font-size:13px;margin:10px 0;white-space:pre-line}
.ok{color:#5fd6a6;font-weight:600} .bad{color:#ff7a7a;white-space:pre-line}
button{display:inline-block;font-size:16px;padding:11px 18px;margin:6px 8px 0 0;border:none;border-radius:8px;background:#26324f;color:#e8ecf4;cursor:pointer}
button.pri{background:#5fd6a6;color:#0d1424;font-weight:600} button:disabled{opacity:.4;cursor:not-allowed}
textarea{width:100%;box-sizing:border-box;margin-top:10px;font-size:12px;word-break:break-all;background:#0d1424;color:#e8ecf4;border:1px solid #2c3a5c;border-radius:6px;padding:8px}
</style>
</head>
<body>
<h1 id="h"></h1>
<div class="card"><div id="lead" class="note"></div></div>
<div class="card" id="c-go"><div id="st" class="note"></div><button id="b-go" class="pri" disabled></button></div>
<div class="card" id="c-out" style="display:none"><div id="who" class="ok"></div><div id="out-lead" class="note"></div>
<textarea id="out" rows="5" readonly></textarea>
<div id="left" class="note"></div>
<button id="b-copy" class="pri"></button><button id="b-clear"></button><div id="msg" class="note"></div>
<div class="warn" id="warn"></div></div>
<script src="lib/xumm.min.js?v=01605dae1b6a"></script>
<script src="xm.js?v=bd495cfeb890"></script>
</body>
</html>
